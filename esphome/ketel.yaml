  #     - output.turn_on: robi_fan_pwm
  #     - output.set_level:
  #         id: robi_fan_pwm
  #         level: "100%"

# https://esphome.io/components/esp8266
esp8266:
  board: d1_mini_lite
  restore_from_flash: true
  early_pin_init: false

############################
# d1_mini_lite has 1MB -- DO NOT ADD ANY FEATURES AND/OR UPGRADE, there is no memory left, will OOMkill regularly!
# disable OTA or encryption if further OOMKills occur.
############################

# RX/TX: also usable, GPIO3/GPIO1; used in Serial.print()/read() & flashing
# D0 is clean
# D1: I2C SCL pin
# D2: I2C SDA pin
# D3+D4 is 12Kohm pullup
# D5+D6+D7 is clean (=serial, but normally unused)
# D8 is pulldown
# A0 is clean (analog, but also works digital)

preferences:
  flash_write_interval: 5min

# Enable logging
logger:
  baud_rate: 0 # disable UART

# Enable Home Assistant API
api:
  encryption:
    key: !secret api.key
  reboot_timeout: 15min

  # wifi connection is crap. re-sync on re-connect
  on_client_connected:
    then:
      - homeassistant.service:
          service: homeassistant.update_entity
          data:
            entity_id: switch.ketel_relay

# saving on memory
mdns:
  disabled: true

ota:
  - platform: esphome
    encryption:   # use api encryption
    # password: !secret ota.password

wifi:
  ssid: !secret wifi.home.ssid
  password: !secret wifi.home.password
  domain: ""
  
  # really weak wifi signal
  #power_save_mode: none
  #output_power: 20.5dB

sensor:
  - platform: wifi_signal
    name: Signal strength

  - platform: uptime
    name: Uptime

switch:
  - platform: gpio
    pin:
      number: D7
      # inverted: true
    id: ketel_relay
    name: "Ketel block"
    restore_mode: RESTORE_DEFAULT_ON
