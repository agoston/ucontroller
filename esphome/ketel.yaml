# https://esphome.io/components/esp8266
############################
# d1_mini_lite has 1MB -- DO NOT ADD ANY FEATURES AND/OR UPGRADE, there is no memory left, will OOMkill regularly!
# disable OTA or encryption if further OOMKills occur.
############################

# RX/TX: also usable, GPIO3/GPIO1; used in Serial.print()/read() & flashing
# D0 is clean
# D1: I2C SCL pin
# D2: I2C SDA pin
# D3+D4 is 12Kohm pullup
# D5+D6+D7 is clean (=serial, but normally unused)
# D8 is pulldown
# A0 is clean (analog, but also works digital)

esphome:
  name: ketel

esp8266:
  board: d1_mini_lite
  restore_from_flash: true
  early_pin_init: false

preferences:
  flash_write_interval: 5min

# Enable logging
logger:
  baud_rate: 0 # disable UART

# Enable Home Assistant API
api:
  encryption:
    key: !secret api.key
  reboot_timeout: 15min

# saving on memory
mdns:
  disabled: true

ota:
  - platform: esphome
    encryption:   # use api encryption
    # password: !secret ota.password

wifi:
  ssid: !secret wifi.home.ssid
  password: !secret wifi.home.password
  domain: ""
  
  # really weak wifi signal
  #power_save_mode: none
  #output_power: 20.5dB
  #fast_connect: true

sensor:
  - platform: wifi_signal
    name: Signal strength

  - platform: uptime
    name: Uptime

# relay is set to internal
# import HA entity (helper boolean), sync its state to relay
# all this because normal HA drops events that happened while esphome had broken connection
# and where `ketel` is, there is plenty of broken connection
switch:
  - platform: gpio
    pin:
      number: D7
      # inverted: true
    id: ketel_relay
    name: "Ketel block"
    internal: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: homeassistant
    id: ketel_block_command
    entity_id: input_boolean.ketel_block
    internal: true

    on_turn_on:
      - switch.turn_on: ketel_relay

    on_turn_off:
      - switch.turn_off: ketel_relay
